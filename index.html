<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto - Pular com Espaço</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #e2e8f0;
    overflow: hidden;
  }
  h1 { color: #38bdf8; margin-bottom: 8px; font-size: 1.4rem; }
  #gameContainer {
    position: relative;
    border: 3px solid #38bdf8;
    border-radius: 10px;
    overflow: hidden;
  }
  canvas { display: block; background: #0ea5e9; }
  #ui {
    position: absolute; top: 10px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    font-weight: bold; text-shadow: 0 1px 3px #000;
    pointer-events: none;
  }
  #message {
    position: absolute; top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px; font-weight: bold;
    opacity: 0; transition: opacity 0.3s;
    text-shadow: 0 0 15px #000; pointer-events: none;
  }
  #controls { margin-top: 12px; text-align: center; color: #94a3b8; font-size: 14px; }
  button {
    margin-top: 8px; padding: 10px 20px;
    background: #0ea5e9; color: white; border: none;
    border-radius: 6px; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>🏍 Moto - Aperte ESPAÇO para pular</h1>
  <div id="gameContainer">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="ui">
      <div>Distância: <span id="dist">0</span>m</div>
      <div>Velocidade: <span id="speed">0</span></div>
    </div>
    <div id="message"></div>
  </div>
  <div id="controls">
    <b>↑</b> Acelerar &nbsp; <b>↓</b> Frear &nbsp; <b>← →</b> Inclinar &nbsp; <b>ESPAÇO</b> Pular
    <br>
    <button type="button" onclick="restart()">Reiniciar</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const distEl = document.getElementById('dist');
const speedEl = document.getElementById('speed');
const messageEl = document.getElementById('message');

let keys = {};
let jumpPressed = false;

// ===== CONTROLES =====
window.addEventListener('keydown', function(e) {
  keys[e.key.toLowerCase()] = true;

  // ESPAÇO = pular
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    jumpPressed = true;
  }
});

window.addEventListener('keyup', function(e) {
  keys[e.key.toLowerCase()] = false;

  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    jumpPressed = false;
  }
});

// ===== MOTO =====
let bike = {
  x: 150,
  y: 280,
  vx: 0,
  vy: 0,
  angle: 0,
  angularVel: 0,
  onGround: true,
  canJump: true,
  crashed: false
};

let cameraX = 0;
let ground = [];
let obstacles = [];
let distance = 0;
let gameOver = false;
let finishX = 0;

// ===== GERA TERRENO =====
function generateTerrain() {
  ground = [];
  obstacles = [];
  let x = 0;
  let y = 310;

  // chão inicial
  for (let i = 0; i < 25; i++) {
    ground.push({ x, y });
    x += 30;
  }

  for (let i = 0; i < 20; i++) {
    const type = Math.random();

    if (type < 0.25) {
      // rampa
      const h = 40 + Math.random() * 40;
      for (let t = 0; t <= 1; t += 0.05) {
        ground.push({ x, y: y - h * t * t });
        x += 8;
      }
      y -= h;
      for (let t = 0; t <= 1; t += 0.05) {
        ground.push({ x, y: y + h * t * t });
        x += 9;
      }
      y += h;
    } else if (type < 0.45) {
      // obstáculo para pular
      for (let j = 0; j < 5; j++) {
        ground.push({ x, y });
        x += 25;
      }
      obstacles.push({
        x: x - 30,
        y: y,
        w: 30 + Math.random() * 20,
        h: 25 + Math.random() * 15
      });
      for (let j = 0; j < 6; j++) {
        ground.push({ x, y });
        x += 25;
      }
    } else {
      // plano
      for (let j = 0; j < 8; j++) {
        y += (Math.random() - 0.5) * 8;
        y = Math.max(280, Math.min(330, y));
        ground.push({ x, y });
        x += 28;
      }
    }
  }

  // final
  for (let i = 0; i < 15; i++) {
    ground.push({ x, y: 310 });
    x += 30;
  }
  finishX = x;
}

function getGroundY(px) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (px >= ground[i].x && px <= ground[i+1].x) {
      const t = (px - ground[i].x) / (ground[i+1].x - ground[i].x || 1);
      return ground[i].y + t * (ground[i+1].y - ground[i].y);
    }
  }
  return 400;
}

function getGroundAngle(px) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (px >= ground[i].x && px <= ground[i+1].x) {
      return Math.atan2(ground[i+1].y - ground[i].y, ground[i+1].x - ground[i].x);
    }
  }
  return 0;
}

function showMessage(text) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
}

function restart() {
  bike = {
    x: 150, y: 280,
    vx: 0, vy: 0,
    angle: 0, angularVel: 0,
    onGround: true,
    canJump: true,
    crashed: false
  };
  cameraX = 0;
  distance = 0;
  gameOver = false;
  jumpPressed = false;
  messageEl.style.opacity = 0;
  generateTerrain();
}

function update() {
  if (gameOver) return;

  const accel = keys['arrowup'] || keys['w'];
  const brake = keys['arrowdown'] || keys['s'];
  const left  = keys['arrowleft'] || keys['a'];
  const right = keys['arrowright'] || keys['d'];

  // ===== NO CHÃO =====
  if (bike.onGround) {
    if (accel) bike.vx += 0.35;
    if (brake) bike.vx *= 0.9;
    bike.vx *= 0.985;

    if (left)  bike.angularVel -= 0.004;
    if (right) bike.angularVel += 0.004;

    // ===== PULO COM ESPAÇO =====
    if (jumpPressed && bike.canJump) {
      bike.vy = -10;        // força do pulo
      bike.onGround = false;
      bike.canJump = false;
    }
  }
  // ===== NO AR =====
  else {
    if (left)  bike.angularVel -= 0.006;
    if (right) bike.angularVel += 0.006;
    bike.angularVel *= 0.97;
  }

  // libera pulo quando soltar espaço
  if (!jumpPressed) {
    bike.canJump = true;
  }

  // limites de velocidade
  bike.vx = Math.max(-2, Math.min(14, bike.vx));

  // física
  bike.x += bike.vx;
  bike.y += bike.vy;
  bike.angle += bike.angularVel;

  // normaliza ângulo
  while (bike.angle > Math.PI) bike.angle -= Math.PI * 2;
  while (bike.angle < -Math.PI) bike.angle += Math.PI * 2;

  // gravidade
  if (!bike.onGround) {
    bike.vy += 0.45;
  }

  // colisão com chão
  const groundY = getGroundY(bike.x);
  const groundAngle = getGroundAngle(bike.x);

  if (bike.y + 16 > groundY) {
    // bateu de ponta cabeça?
    if (Math.abs(bike.angle) > 2.1) {
      bike.crashed = true;
      gameOver = true;
      showMessage('PONTA-CABEÇA! 💥');
      return;
    }

    // colisão com obstáculo
    for (let o of obstacles) {
      if (bike.x + 16 > o.x && bike.x - 16 < o.x + o.w &&
          bike.y + 10 > o.y - o.h) {
        bike.crashed = true;
        gameOver = true;
        showMessage('BATEU NO OBSTÁCULO! 💥');
        return;
      }
    }

    // aterrissou
    bike.y = groundY - 16;
    bike.vy = 0;
    bike.onGround = true;
    bike.canJump = true;
    bike.angle += (groundAngle - bike.angle) * 0.3;
    bike.angularVel *= 0.6;

    // sai da rampa
    if (groundAngle < -0.25 && bike.vx > 5) {
      bike.vy = groundAngle * bike.vx * 0.9;
      bike.onGround = false;
    }
  } else {
    bike.onGround = false;
  }

  // linha de chegada
  if (bike.x >= finishX) {
    gameOver = true;
    showMessage('🏁 CHEGADA!');
  }

  // caiu do mapa
  if (bike.y > 500) {
    gameOver = true;
    showMessage('CAIU! 😱');
  }

  cameraX = bike.x - 200;
  distance = Math.max(0, Math.floor((bike.x - 150) / 10));
  distEl.textContent = distance;
  speedEl.textContent = Math.floor(Math.abs(bike.vx) * 12);
}

function draw() {
  // céu
  const grad = ctx.createLinearGradient(0, 0, 0, 400);
  grad.addColorStop(0, '#0ea5e9');
  grad.addColorStop(0.45, '#38bdf8');
  grad.addColorStop(0.45, '#94a3b8');
  grad.addColorStop(1, '#64748b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 800, 400);

  // montanhas
  ctx.fillStyle = '#64748b';
  for (let i = 0; i < 6; i++) {
    const mx = (i * 180 - cameraX * 0.3) % 900 - 50;
    ctx.beginPath();
    ctx.moveTo(mx, 200);
    ctx.lineTo(mx + 90, 80);
    ctx.lineTo(mx + 180, 200);
    ctx.fill();
  }

  // chão
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(0, 400);
  for (let p of ground) {
    const gx = p.x - cameraX;
    if (gx > -40 && gx < 840) ctx.lineTo(gx, p.y);
  }
  ctx.lineTo(800, 400);
  ctx.fill();

  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let first = true;
  for (let p of ground) {
    const gx = p.x - cameraX;
    if (gx > -20 && gx < 820) {
      if (first) { ctx.moveTo(gx, p.y); first = false; }
      else ctx.lineTo(gx, p.y);
    }
  }
  ctx.stroke();

  // obstáculos
  for (let o of obstacles) {
    const ox = o.x - cameraX;
    if (ox < -40 || ox > 840) continue;
    ctx.fillStyle = '#78716c';
    ctx.fillRect(ox, o.y - o.h, o.w, o.h);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(ox, o.y - o.h, o.w, 5);
  }

  // linha de chegada
  const fx = finishX - cameraX;
  if (fx > -20 && fx < 820) {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(fx, 130, 8, 180);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('CHEGADA', fx - 10, 120);
  }

  // moto
  if (!bike.crashed) {
    ctx.save();
    ctx.translate(bike.x - cameraX, bike.y);
    ctx.rotate(bike.angle);

    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 18, 26, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // corpo
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-24, -6, 48, 12);

    // banco
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-6, -12, 22, 6);

    // rodas
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(-18, 10, 10, 0, Math.PI * 2);
    ctx.arc(18, 10, 10, 0, Math.PI * 2);
    ctx.fill();

    // piloto
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(2, -18, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

restart();
loop();
</script>
</body>
</html>
