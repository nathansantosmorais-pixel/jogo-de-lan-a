<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stickman Archer - Alvo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 8px;
    color: #e94560;
    text-shadow: 0 0 10px #e9456088;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #e94560;
    border-radius: 8px;
    box-shadow: 0 0 30px #e9456044;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
    cursor: crosshair;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 14px;
    font-weight: bold;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    color: #fbbf24;
    text-shadow: 0 0 8px #fbbf24aa;
  }
  #shots {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #aaa;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 0 20px #000;
  }
  #controls {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #aaa;
    max-width: 480px;
  }
  button {
    margin-top: 10px;
    padding: 10px 24px;
    font-size: 16px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #ff6b81; }
</style>
</head>
<body>
  <h1>🏹 Stickman Archer - Alvo</h1>
  <div id="gameContainer">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="score">Pontos: 0</div>
    <div id="shots">Flechas: 0</div>
    <div id="message"></div>
  </div>
  <div id="controls">
    <b>Como jogar:</b> Clique e arraste para mirar e carregar a força. Solte para atirar no alvo.<br>
    Centro = 100 pontos | Amarelo = 50 | Vermelho = 25 | Branco = 10
    <br>
    <button onclick="resetScore()">Zerar Pontuação</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const shotsEl = document.getElementById('shots');
const messageEl = document.getElementById('message');

function resize() {
  const maxW = Math.min(800, window.innerWidth - 20);
  const ratio = 800 / 450;
  canvas.style.width = maxW + 'px';
  canvas.style.height = (maxW / ratio) + 'px';
}
resize();
window.addEventListener('resize', resize);

let score = 0;
let shots = 0;

const gravity = 0.25;
const groundY = 400;

const player = { x: 80, y: groundY };

// Alvo
const target = {
  x: 650,
  y: 220,
  radius: 70
};

let arrows = [];
let isAiming = false;
let aimStart = { x: 0, y: 0 };
let aimCurrent = { x: 0, y: 0 };
let particles = [];
let stuckArrows = []; // flechas que ficaram no alvo

function showMessage(text, duration = 1200) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
  setTimeout(() => { messageEl.style.opacity = 0; }, duration);
}

function createParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 2,
      life: 25 + Math.random() * 20,
      color
    });
  }
}

function drawStickman(x, y, armAngle = 0, bowDrawn = 0) {
  ctx.save();
  ctx.translate(x, y);

  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  // Cabeça
  ctx.beginPath();
  ctx.arc(0, -55, 12, 0, Math.PI * 2);
  ctx.stroke();

  // Corpo
  ctx.beginPath();
  ctx.moveTo(0, -43);
  ctx.lineTo(0, -10);
  ctx.stroke();

  // Pernas
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(-12, 0);
  ctx.moveTo(0, -10);
  ctx.lineTo(12, 0);
  ctx.stroke();

  // Braço livre
  ctx.beginPath();
  ctx.moveTo(0, -35);
  ctx.lineTo(-15, -20);
  ctx.stroke();

  // Braço do arco
  const bowX = 8;
  const bowY = -35;
  ctx.beginPath();
  ctx.moveTo(0, -35);
  ctx.lineTo(bowX + Math.cos(armAngle) * 20, bowY + Math.sin(armAngle) * 20);
  ctx.stroke();

  // Arco
  ctx.beginPath();
  ctx.arc(bowX, bowY, 18, -1.2 + armAngle, 1.2 + armAngle);
  ctx.stroke();

  // Corda
  if (bowDrawn > 0) {
    const pull = bowDrawn * 12;
    ctx.beginPath();
    ctx.moveTo(bowX + Math.cos(armAngle - 1.2) * 18, bowY + Math.sin(armAngle - 1.2) * 18);
    ctx.lineTo(bowX - Math.cos(armAngle) * pull, bowY - Math.sin(armAngle) * pull);
    ctx.lineTo(bowX + Math.cos(armAngle + 1.2) * 18, bowY + Math.sin(armAngle + 1.2) * 18);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();
}

function drawTarget() {
  const zones = [
    { r: 70, color: '#f8fafc' },   // branco externo
    { r: 55, color: '#ef4444' },   // vermelho
    { r: 40, color: '#f8fafc' },   // branco
    { r: 25, color: '#eab308' },   // amarelo
    { r: 12, color: '#ef4444' }    // centro vermelho
  ];

  zones.forEach(z => {
    ctx.beginPath();
    ctx.arc(target.x, target.y, z.r, 0, Math.PI * 2);
    ctx.fillStyle = z.color;
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // Cruz no centro
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(target.x - 8, target.y);
  ctx.lineTo(target.x + 8, target.y);
  ctx.moveTo(target.x, target.y - 8);
  ctx.lineTo(target.x, target.y + 8);
  ctx.stroke();
}

function drawArrow(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(Math.atan2(a.vy, a.vx));

  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(12, 0);
  ctx.stroke();

  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(6, -4);
  ctx.lineTo(6, 4);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(-16, -3);
  ctx.moveTo(-12, 0);
  ctx.lineTo(-16, 3);
  ctx.stroke();

  ctx.restore();
}

function getAimPower() {
  const dx = aimStart.x - aimCurrent.x;
  const dy = aimStart.y - aimCurrent.y;
  return Math.min(Math.sqrt(dx * dx + dy * dy) / 8, 18);
}

function getAimAngle() {
  return Math.atan2(-(aimStart.y - aimCurrent.y), aimStart.x - aimCurrent.x);
}

function shootArrow(x, y, angle, power) {
  const speed = power * 0.9;
  arrows.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    stuck: false
  });
  shots++;
  shotsEl.textContent = 'Flechas: ' + shots;
}

function getTargetScore(dist) {
  if (dist <= 12) return 100;      // centro
  if (dist <= 25) return 50;       // amarelo
  if (dist <= 40) return 25;       // branco interno
  if (dist <= 55) return 15;       // vermelho
  if (dist <= 70) return 10;       // branco externo
  return 0;
}

function update() {
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    if (a.stuck) continue;

    a.vy += gravity;
    a.x += a.vx;
    a.y += a.vy;

    // Colisão com o alvo
    const dist = Math.hypot(a.x - target.x, a.y - target.y);
    if (dist <= target.radius + 5) {
      a.stuck = true;
      a.vx = 0;
      a.vy = 0;

      const points = getTargetScore(dist);
      if (points > 0) {
        score += points;
        scoreEl.textContent = 'Pontos: ' + score;
        createParticles(a.x, a.y, points >= 50 ? '#eab308' : '#ef4444');
        
        if (points === 100) showMessage('BULLSEYE! +100');
        else if (points === 50) showMessage('Ótimo! +50');
        else if (points >= 25) showMessage('+' + points);
        else showMessage('+' + points);
      } else {
        showMessage('Errou!');
      }

      stuckArrows.push(a);
      arrows.splice(i, 1);
      continue;
    }

    // Chão
    if (a.y > groundY - 5) {
      a.y = groundY - 5;
      a.vx *= 0.5;
      a.vy = 0;
      a.stuck = true;
      stuckArrows.push(a);
      arrows.splice(i, 1);
      continue;
    }

    // Fora da tela
    if (a.x < -50 || a.x > 850 || a.y < -80) {
      arrows.splice(i, 1);
    }
  }

  // Partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Chão
  ctx.fillStyle = '#2d3748';
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
  ctx.strokeStyle = '#4a5568';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(canvas.width, groundY);
  ctx.stroke();

  // Alvo
  drawTarget();

  // Flechas presas no alvo / chão
  stuckArrows.forEach(drawArrow);

  // Linha de mira
  if (isAiming) {
    const power = getAimPower();
    const angle = getAimAngle();

    ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    let predX = player.x + 15;
    let predY = player.y - 40;
    let predVX = Math.cos(angle) * power * 0.9;
    let predVY = Math.sin(angle) * power * 0.9;
    ctx.moveTo(predX, predY);
    for (let t = 0; t < 50; t++) {
      predX += predVX;
      predY += predVY;
      predVY += gravity;
      ctx.lineTo(predX, predY);
      if (predY > groundY) break;
    }
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#fbbf24';
    ctx.font = '14px sans-serif';
    ctx.fillText('Força: ' + Math.round(power), aimCurrent.x + 12, aimCurrent.y - 10);
  }

  // Stickman
  let armAngle = 0;
  let bowDrawn = 0;
  if (isAiming) {
    armAngle = getAimAngle();
    bowDrawn = Math.min(getAimPower() / 18, 1);
  }
  drawStickman(player.x, player.y, armAngle, bowDrawn);

  // Flechas voando
  arrows.forEach(drawArrow);

  // Partículas
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 40);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', e => {
  isAiming = true;
  aimStart = { x: player.x + 10, y: player.y - 40 };
  aimCurrent = getPos(e);
});

canvas.addEventListener('mousemove', e => {
  if (!isAiming) return;
  aimCurrent = getPos(e);
});

canvas.addEventListener('mouseup', () => {
  if (!isAiming) return;
  isAiming = false;
  const power = getAimPower();
  if (power > 2) {
    shootArrow(player.x + 15, player.y - 40, getAimAngle(), power);
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  isAiming = true;
  aimStart = { x: player.x + 10, y: player.y - 40 };
  aimCurrent = getPos(e);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isAiming) return;
  aimCurrent = getPos(e);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!isAiming) return;
  isAiming = false;
  const power = getAimPower();
  if (power > 2) {
    shootArrow(player.x + 15, player.y - 40, getAimAngle(), power);
  }
}, { passive: false });

function resetScore() {
  score = 0;
  shots = 0;
  stuckArrows = [];
  arrows = [];
  scoreEl.textContent = 'Pontos: 0';
  shotsEl.textContent = 'Flechas: 0';
  showMessage('Pontuação zerada!');
}

loop();
</script>
</body>
</html>
