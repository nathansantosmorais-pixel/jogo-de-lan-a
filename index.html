<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Rampas - Corrida</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 6px;
    color: #38bdf8;
    text-shadow: 0 0 12px #38bdf888;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #38bdf8;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(56,189,248,0.3);
    overflow: hidden;
  }
  canvas { display: block; }
  #ui {
    position: absolute;
    top: 8px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 1px 3px #000;
  }
  #ranking {
    position: absolute;
    top: 40px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    pointer-events: none;
    line-height: 1.5;
  }
  #message {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 0 20px #000;
  }
  #countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 90px;
    font-weight: 900;
    color: #fbbf24;
    text-shadow: 0 0 30px #f59e0b, 0 4px 12px #000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s;
  }
  #controls {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    max-width: 540px;
  }
  button {
    margin: 8px 6px;
    padding: 9px 20px;
    font-size: 14px;
    background: #0ea5e9;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #38bdf8; }
</style>
</head>
<body>
  <h1>🏍 Moto Rampas - Corrida</h1>
  <div id="gameContainer">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="ui">
      <div>Distância: <span id="dist">0</span>m</div>
      <div>Velocidade: <span id="speed">0</span> km/h</div>
    </div>
    <div id="ranking"></div>
    <div id="message"></div>
    <div id="countdown"></div>
  </div>
  <div id="controls">
    <b>Controles:</b> ← → / A D inclinar | ↑ / W acelerar | ↓ / S frear | <b>ENTER</b> pular<br>
    Espere o 3... 2... 1... JÁ!
    <br>
    <button onclick="restart()">Reiniciar</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const distEl = document.getElementById('dist');
const speedEl = document.getElementById('speed');
const rankingEl = document.getElementById('ranking');
const messageEl = document.getElementById('message');
const countdownEl = document.getElementById('countdown');

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const COLORS = ['#ef4444', '#22c55e', '#a855f7', '#f59e0b'];
const NAMES  = ['Você', 'Rival 1', 'Rival 2', 'Rival 3'];

let bikes = [];
let cameraX = 0;
let ground = [];
let obstacles = [];
let distance = 0;
let gameOver = false;
let finished = false;
let finishX = 0;
let raceFinished = false;
let raceStarted = false;   // só libera os controles depois do "JÁ!"
let countingDown = false;

function createBike(x, color, isPlayer = false) {
  return {
    x, y: 280,
    vx: 0, vy: 0,
    angle: 0, angularVel: 0,
    onGround: true,
    crashed: false,
    finished: false,
    color,
    isPlayer,
    finishTime: 0,
    canJump: true
  };
}

function generateTerrain() {
  ground = [];
  obstacles = [];
  let x = 0;
  let y = 310;

  for (let i = 0; i < 30; i++) {
    ground.push({ x, y });
    x += 28;
  }

  for (let i = 0; i < 22; i++) {
    const type = Math.random();

    if (type < 0.18) {
      const height = 35 + Math.random() * 30;
      const upLen = 100 + Math.random() * 40;
      const downLen = 110 + Math.random() * 50;
      for (let t = 0; t <= 1; t += 0.05) {
        const ease = t * t * (3 - 2 * t);
        ground.push({ x, y: y - height * ease });
        x += upLen * 0.05;
      }
      y -= height;
      for (let j = 0; j < 2; j++) { ground.push({ x, y }); x += 18; }
      for (let t = 0; t <= 1; t += 0.05) {
        const ease = t * t * (3 - 2 * t);
        ground.push({ x, y: y + height * ease });
        x += downLen * 0.05;
      }
      y += height;
    } else if (type < 0.42) {
      const height = 55 + Math.random() * 35;
      const rampLen = 90 + Math.random() * 30;
      for (let t = 0; t <= 1; t += 0.04) {
        const ease = Math.pow(t, 1.5);
        ground.push({ x, y: y - height * ease });
        x += rampLen * 0.04;
      }
      y -= height;
      for (let j = 0; j < 2; j++) { ground.push({ x, y }); x += 12; }
      const gapStart = x;
      const gap = 90 + Math.random() * 70;
      x += gap;
      obstacles.push({
        x: gapStart + gap * 0.55,
        y: y + 8,
        w: 28 + Math.random() * 18,
        h: 22 + Math.random() * 16
      });
      const landHeight = height * 0.5;
      for (let t = 0; t <= 1; t += 0.06) {
        ground.push({ x, y: y + landHeight * t * t });
        x += 22;
      }
      y += landHeight;
    } else if (type < 0.55) {
      for (let j = 0; j < 6; j++) {
        ground.push({ x, y });
        x += 25;
      }
      obstacles.push({
        x: x - 40,
        y: y - 5,
        w: 32 + Math.random() * 20,
        h: 26 + Math.random() * 18
      });
      for (let j = 0; j < 8; j++) {
        ground.push({ x, y });
        x += 25;
      }
    } else {
      for (let j = 0; j < 12; j++) {
        y += (Math.random() - 0.5) * 6;
        y = Math.max(290, Math.min(325, y));
        ground.push({ x, y });
        x += 26;
      }
    }
  }

  for (let i = 0; i < 18; i++) {
    ground.push({ x, y: 310 });
    x += 28;
  }
  finishX = x + 10;
  for (let i = 0; i < 10; i++) {
    ground.push({ x, y: 310 });
    x += 28;
  }
}

function getGroundY(atX) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (atX >= ground[i].x && atX <= ground[i + 1].x) {
      const t = (atX - ground[i].x) / (ground[i + 1].x - ground[i].x || 1);
      const s = t * t * (3 - 2 * t);
      return ground[i].y + s * (ground[i + 1].y - ground[i].y);
    }
  }
  return 400;
}

function getGroundAngle(atX) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (atX >= ground[i].x && atX <= ground[i + 1].x) {
      return Math.atan2(ground[i + 1].y - ground[i].y, ground[i + 1].x - ground[i].x);
    }
  }
  return 0;
}

function showMessage(text, duration = 2000) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
  if (duration < 90000) {
    setTimeout(() => {
      if (!gameOver && !raceFinished) messageEl.style.opacity = 0;
    }, duration);
  }
}

function showCountdown(text) {
  countdownEl.textContent = text;
  countdownEl.style.opacity = 1;
  countdownEl.style.transform = 'translate(-50%, -50%) scale(1.2)';
  setTimeout(() => {
    countdownEl.style.transform = 'translate(-50%, -50%) scale(1)';
  }, 50);
}

function startCountdown() {
  countingDown = true;
  raceStarted = false;

  showCountdown('3');
  setTimeout(() => showCountdown('2'), 900);
  setTimeout(() => showCountdown('1'), 1800);
  setTimeout(() => {
    showCountdown('JÁ!');
    setTimeout(() => {
      countdownEl.style.opacity = 0;
      countingDown = false;
      raceStarted = true;
    }, 700);
  }, 2700);
}

function restart() {
  bikes = [
    createBike(130, COLORS[0], true),
    createBike(90,  COLORS[1]),
    createBike(55,  COLORS[2]),
    createBike(25,  COLORS[3])
  ];
  cameraX = 0;
  distance = 0;
  gameOver = false;
  finished = false;
  raceFinished = false;
  raceStarted = false;
  messageEl.style.opacity = 0;
  countdownEl.style.opacity = 0;
  generateTerrain();
  updateRanking();
  startCountdown();
}

function checkObstacleCollision(b) {
  if (b.crashed || !b.onGround) return false;
  for (const o of obstacles) {
    if (b.x + 18 > o.x && b.x - 18 < o.x + o.w &&
        b.y + 12 > o.y - o.h) {
      return true;
    }
  }
  return false;
}

function updateBike(b) {
  if (b.crashed || b.finished) return;

  // Só move depois do "JÁ!"
  if (!raceStarted) return;

  if (b.isPlayer) {
    const accel = keys['arrowup'] || keys['w'];
    const brake = keys['arrowdown'] || keys['s'];
    const left  = keys['arrowleft'] || keys['a'];
    const right = keys['arrowright'] || keys['d'];
    const jump  = keys['enter'];

    if (b.onGround) {
      if (accel) b.vx += 0.34;
      if (brake) b.vx *= 0.90;
      b.vx *= 0.986;
      if (left)  b.angularVel -= 0.0036;
      if (right) b.angularVel += 0.0036;

      if (jump && b.canJump) {
        b.vy = -9.5;
        b.onGround = false;
        b.canJump = false;
      }
    } else {
      if (left)  b.angularVel -= 0.0058;
      if (right) b.angularVel += 0.0058;
      b.angularVel *= 0.97;
    }
    if (!jump) b.canJump = true;

  } else {
    if (b.onGround) {
      b.vx += 0.27 + Math.random() * 0.09;
      b.vx *= 0.987;
      const ga = getGroundAngle(b.x);
      b.angularVel += (ga - b.angle) * 0.02;

      for (const o of obstacles) {
        if (o.x - b.x < 90 && o.x - b.x > 20 && b.canJump) {
          b.vy = -9.2;
          b.onGround = false;
          b.canJump = false;
        }
      }
    } else {
      b.angularVel += -b.angle * 0.016;
      b.angularVel *= 0.96;
      b.canJump = true;
    }
  }

  b.vx = Math.max(-2, Math.min(13.5, b.vx));
  b.x += b.vx;
  b.y += b.vy;
  b.angle += b.angularVel;

  while (b.angle > Math.PI) b.angle -= Math.PI * 2;
  while (b.angle < -Math.PI) b.angle += Math.PI * 2;

  if (!b.onGround) b.vy += 0.42;

  const groundY = getGroundY(b.x);
  const groundAngle = getGroundAngle(b.x);

  if (b.y + 17 > groundY) {
    if (checkObstacleCollision(b)) {
      b.crashed = true;
      if (b.isPlayer) {
        gameOver = true;
        showMessage('BATEU NO OBSTÁCULO! 💥', 99999);
      }
      return;
    }

    if (Math.abs(b.angle) > 2.05) {
      b.crashed = true;
      if (b.isPlayer) {
        gameOver = true;
        showMessage('PONTA-CABEÇA! 💥', 99999);
      }
      return;
    }

    b.y = groundY - 17;
    b.vy *= 0.12;
    b.onGround = true;
    b.canJump = true;
    b.angle += (groundAngle - b.angle) * 0.3;
    b.angularVel *= 0.6;

    if (groundAngle < -0.22 && b.vx > 4.5) {
      b.vy = groundAngle * b.vx * 0.95;
      b.onGround = false;
    }
  } else {
    b.onGround = false;
  }

  if (b.x >= finishX && !b.finished) {
    b.finished = true;
    b.finishTime = performance.now();
    if (b.isPlayer) {
      finished = true;
      raceFinished = true;
      const pos = bikes.filter(bk => bk.finished).length;
      showMessage(`🏁 Você chegou em ${pos}º lugar!`, 99999);
    }
  }

  if (b.y > 530) {
    b.crashed = true;
    if (b.isPlayer) {
      gameOver = true;
      showMessage('CAIU NO ABISMO! 😱', 99999);
    }
  }
}

function updateRanking() {
  const sorted = [...bikes].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    if (a.crashed && !b.crashed) return 1;
    if (b.crashed && !a.crashed) return -1;
    return b.x - a.x;
  });

  let html = '';
  sorted.forEach((b, i) => {
    const name = NAMES[bikes.indexOf(b)];
    const status = b.crashed ? '💥' : (b.finished ? '🏁' : '');
    html += `<div style="color:${b.color}">${i + 1}. ${name} ${status}</div>`;
  });
  rankingEl.innerHTML = html;
}

function update() {
  if (gameOver) return;
  bikes.forEach(b => updateBike(b));
  cameraX = bikes[0].x - 280;
  distance = Math.max(0, Math.floor((bikes[0].x - 120) / 10));
  distEl.textContent = distance;
  speedEl.textContent = Math.floor(Math.abs(bikes[0].vx) * 11.5);
  updateRanking();
}

function drawObstacles() {
  for (const o of obstacles) {
    const ox = o.x - cameraX;
    if (ox < -50 || ox > 850) continue;
    ctx.fillStyle = '#78716c';
    ctx.fillRect(ox, o.y - o.h, o.w, o.h);
    ctx.strokeStyle = '#44403c';
    ctx.lineWidth = 2;
    ctx.strokeRect(ox, o.y - o.h, o.w, o.h);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(ox, o.y - o.h, o.w, 6);
    ctx.fillStyle = '#0f172a';
    for (let i = 0; i < o.w; i += 10) {
      ctx.fillRect(ox + i, o.y - o.h, 5, 6);
    }
  }
}

function drawBike(b) {
  if (b.crashed) {
    ctx.save();
    ctx.translate(b.x - cameraX, b.y);
    ctx.rotate(b.angle + 0.9);
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(-22, -5, 44, 10);
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(b.x - cameraX, b.y);
  ctx.rotate(b.angle);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 19, 26, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = b.color;
  ctx.fillRect(-24, -6, 48, 12);

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-7, -12, 24, 6);

  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(15, -6);
  ctx.lineTo(22, -15);
  ctx.lineTo(27, -13);
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-18, 10, 10, 0, Math.PI * 2);
  ctx.arc(18, 10, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(3, -18, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3b82f6';
  ctx.beginPath();
  ctx.arc(3, -20, 6, Math.PI, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFinishLine() {
  const fx = finishX - cameraX;
  if (fx < -60 || fx > 860) return;

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(fx - 5, 115, 10, 195);
  ctx.fillRect(fx + 48, 115, 10, 195);

  const square = 11;
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 5; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#0f172a' : '#f8fafc';
      ctx.fillRect(fx + col * square, 115 + row * square, square, square);
    }
  }

  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('CHEGADA', fx + 26, 105);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const sky = ctx.createLinearGradient(0, 0, 0, 400);
  sky.addColorStop(0, '#0ea5e9');
  sky.addColorStop(0.42, '#38bdf8');
  sky.addColorStop(0.42, '#94a3b8');
  sky.addColorStop(1, '#64748b');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 800, 400);

  ctx.fillStyle = '#64748b';
  for (let i = 0; i < 8; i++) {
    const mx = ((i * 200) - cameraX * 0.22) % 900 - 100;
    ctx.beginPath();
    ctx.moveTo(mx, 200);
    ctx.lineTo(mx + 100, 70 + (i % 3) * 26);
    ctx.lineTo(mx + 200, 200);
    ctx.fill();
  }

  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(-20, 400);
  for (let i = 0; i < ground.length; i++) {
    const gx = ground[i].x - cameraX;
    if (gx > -50 && gx < 850) ctx.lineTo(gx, ground[i].y);
  }
  ctx.lineTo(820, 400);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < ground.length; i++) {
    const gx = ground[i].x - cameraX;
    if (gx > -30 && gx < 830) {
      if (!started) { ctx.moveTo(gx, ground[i].y); started = true; }
      else ctx.lineTo(gx, ground[i].y);
    }
  }
  ctx.stroke();

  drawObstacles();
  drawFinishLine();

  for (let i = bikes.length - 1; i >= 0; i--) {
    drawBike(bikes[i]);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

restart();
loop();
</script>
</body>
</html>
