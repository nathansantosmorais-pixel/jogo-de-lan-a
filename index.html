<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pênaltis Realista</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #071a07;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    text-shadow: 0 0 12px #00ff88;
  }
  #gameContainer {
    position: relative;
    border: 4px solid #fff;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,255,100,0.25);
    overflow: hidden;
  }
  canvas {
    display: block;
    cursor: crosshair;
  }
  #scoreboard {
    position: absolute;
    top: 12px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 50px;
    font-size: 22px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 2px 6px #000;
  }
  #message {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
    text-shadow: 0 0 30px #000;
  }
  #controls {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #cfc;
    max-width: 520px;
  }
  button {
    margin: 8px 6px;
    padding: 10px 24px;
    font-size: 15px;
    background: #00aa55;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #00cc66; }
</style>
</head>
<body>
  <h1>⚽ Pênaltis</h1>
  <div id="gameContainer">
    <canvas id="game" width="800" height="540"></canvas>
    <div id="scoreboard">
      <div>Gols: <span id="goals">0</span></div>
      <div>Defesas: <span id="saves">0</span></div>
    </div>
    <div id="message"></div>
  </div>
  <div id="controls">
    <b>Como jogar:</b> Clique e <b>risque / arraste</b> o mouse para mirar. Solte para chutar!<br>
    Física mais realista + goleiro com reação.
    <br>
    <button onclick="resetGame()">Reiniciar</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const goalsEl = document.getElementById('goals');
const savesEl = document.getElementById('saves');
const messageEl = document.getElementById('message');

function resize() {
  const maxW = Math.min(800, window.innerWidth - 20);
  const ratio = 800 / 540;
  canvas.style.width = maxW + 'px';
  canvas.style.height = (maxW / ratio) + 'px';
}
resize();
window.addEventListener('resize', resize);

let goals = 0, saves = 0;
let canShoot = true, isAiming = false;
let aimStart = {x:0,y:0}, aimCurrent = {x:0,y:0};

// Efeito de tremor de tela
let shake = 0;

const ballStart = {x:400, y:455};
const goalY = 58, goalLeft = 230, goalRight = 570, goalHeight = 140;

let ball = {
  x: ballStart.x, y: ballStart.y,
  vx: 0, vy: 0,
  radius: 12,
  moving: false,
  rotation: 0,
  spin: 0
};

let keeper = {
  x: 400, y: goalY + 82,
  targetX: 400,
  diving: false,
  diveDir: 0,
  diveProgress: 0,
  scale: 0.72,
  reactionTimer: 0       // atraso de reação
};

let player = {
  x: 400, y: 495,
  lean: 0,
  legKick: 0,
  armSwing: 0
};

let particles = [];

function showMessage(text, duration=1700) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
  setTimeout(() => messageEl.style.opacity = 0, duration);
}

function createParticles(x, y, color, count=18) {
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*14,
      vy: (Math.random()-0.5)*14 - 5,
      life: 35 + Math.random()*30,
      color,
      size: 2 + Math.random()*4
    });
  }
}

function addShake(amount) {
  shake = Math.max(shake, amount);
}

// ===================== CAMPO =====================
function drawField() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 120);
  skyGrad.addColorStop(0, '#1a3a5c');
  skyGrad.addColorStop(1, '#0d2818');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, 120);

  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, 70, canvas.width, 50);
  for (let i = 0; i < 90; i++) {
    ctx.fillStyle = `hsl(${Math.random()*70+10}, 35%, ${25+Math.random()*35}%)`;
    ctx.beginPath();
    ctx.arc(15 + Math.random()*770, 76 + Math.random()*38, 1.8 + Math.random()*2.5, 0, Math.PI*2);
    ctx.fill();
  }

  const grassGrad = ctx.createLinearGradient(0, 120, 0, canvas.height);
  grassGrad.addColorStop(0, '#2d8a2d');
  grassGrad.addColorStop(0.45, '#228b22');
  grassGrad.addColorStop(1, '#1a6b1a');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, 120, canvas.width, canvas.height - 120);

  for (let i = 0; i < 18; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.045)';
    ctx.fillRect(0, 120 + i * 24, canvas.width, 24);
  }

  // Marca do pênalti
  ctx.beginPath();
  ctx.arc(400, 455, 6, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ===================== GOL =====================
function drawGoal() {
  ctx.strokeStyle = 'rgba(220,220,220,0.22)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    const x = goalLeft + (i / 12) * (goalRight - goalLeft);
    ctx.beginPath();
    ctx.moveTo(x, goalY);
    ctx.lineTo(x - 8, goalY + goalHeight + 10);
    ctx.stroke();
  }
  for (let i = 0; i <= 6; i++) {
    const y = goalY + (i / 6) * (goalHeight + 5);
    ctx.beginPath();
    ctx.moveTo(goalLeft, y);
    ctx.lineTo(goalRight, y);
    ctx.stroke();
  }

  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(goalLeft, goalY + goalHeight + 5);
  ctx.lineTo(goalLeft, goalY);
  ctx.lineTo(goalRight, goalY);
  ctx.lineTo(goalRight, goalY + goalHeight + 5);
  ctx.stroke();
}

// ===================== JOGADOR =====================
function drawPlayer() {
  const p = player;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.lean * 0.18);

  const skin = '#d2a679', shirt = '#1a73e8', shorts = '#f5f5f5';
  const socks = '#1a73e8', boots = '#1a1a1a';

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 8, 28, 8, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = skin; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, -30);
  ctx.quadraticCurveTo(-16, -5, -18, 20);
  ctx.stroke();

  ctx.strokeStyle = socks; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(-16, 8); ctx.lineTo(-18, 22); ctx.stroke();

  ctx.fillStyle = boots;
  ctx.beginPath();
  ctx.ellipse(-22, 30, 13, 7, -0.35, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = skin; ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(6, -30);
  ctx.quadraticCurveTo(10 + p.legKick*12, -8, 16 + p.legKick*22, 18);
  ctx.stroke();

  ctx.strokeStyle = socks; ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(12 + p.legKick*14, 2);
  ctx.lineTo(16 + p.legKick*22, 18);
  ctx.stroke();

  ctx.fillStyle = boots;
  ctx.beginPath();
  ctx.ellipse(20 + p.legKick*24, 28, 13, 7, 0.25, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = shorts;
  ctx.beginPath();
  ctx.moveTo(-20, -42); ctx.lineTo(20, -42);
  ctx.lineTo(18, -22); ctx.lineTo(-18, -22);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.moveTo(-22, -78); ctx.lineTo(22, -78);
  ctx.lineTo(20, -38); ctx.lineTo(-20, -38);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#0d47a1';
  ctx.beginPath();
  ctx.moveTo(-10, -78); ctx.lineTo(10, -78);
  ctx.lineTo(6, -70); ctx.lineTo(-6, -70);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = skin; ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-20, -68);
  ctx.quadraticCurveTo(-32, -50 + p.armSwing*8, -36, -28);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(20, -68);
  ctx.quadraticCurveTo(34, -52, 38 + p.armSwing*6, -30);
  ctx.stroke();

  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -95, 16, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#2c1b0e';
  ctx.beginPath(); ctx.arc(0, -100, 15, Math.PI*1.05, Math.PI*1.95); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2, -108, 12, 7, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(-5, -95, 2.2, 0, Math.PI*2);
  ctx.arc(5, -95, 2.2, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ===================== GOLEIRO =====================
function drawKeeper() {
  const k = keeper;
  ctx.save();
  ctx.translate(k.x, k.y);
  ctx.scale(k.scale, k.scale);

  let rot = 0, armL = -0.4, armR = 0.4, legL = 0.15, legR = -0.15;

  if (k.diving) {
    const t = Math.min(k.diveProgress, 1);
    rot = k.diveDir * t * 1.1;

    if (k.diveDir < 0) {
      armL = -2.2 * t; armR = 0.15;
      legL = 1.15 * t; legR = -0.55 * t;
    } else if (k.diveDir > 0) {
      armR = 2.2 * t; armL = -0.15;
      legR = -1.15 * t; legL = 0.55 * t;
    } else {
      armL = -1.5 * t; armR = 1.5 * t;
      legL = 0.55 * t; legR = -0.55 * t;
    }
  }

  ctx.rotate(rot);

  const skin = '#d2a679', jersey = '#f5c518', pants = '#1a1a1a';
  const gloves = '#111', boots = '#222';

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.ellipse(0, 45, 32, 9, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = skin; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-10, 8);
  ctx.quadraticCurveTo(-14 + Math.sin(legL)*12, 32, -16 + Math.sin(legL)*22, 58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(10, 8);
  ctx.quadraticCurveTo(14 + Math.sin(legR)*12, 32, 16 + Math.sin(legR)*22, 58);
  ctx.stroke();

  ctx.fillStyle = boots;
  ctx.beginPath();
  ctx.ellipse(-18 + Math.sin(legL)*22, 64, 12, 7, -0.2, 0, Math.PI*2);
  ctx.ellipse(18 + Math.sin(legR)*22, 64, 12, 7, 0.2, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = pants;
  ctx.beginPath();
  ctx.moveTo(-24, -18); ctx.lineTo(24, -18);
  ctx.lineTo(22, 18); ctx.lineTo(-22, 18);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = jersey;
  ctx.beginPath();
  ctx.moveTo(-24, -62); ctx.lineTo(24, -62);
  ctx.lineTo(22, -12); ctx.lineTo(-22, -12);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#e0b000';
  ctx.fillRect(-24, -40, 48, 8);

  ctx.fillStyle = '#111';
  ctx.font = 'bold 26px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('1', 0, -28);

  ctx.strokeStyle = skin; ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-22, -50);
  ctx.quadraticCurveTo(-38 + Math.cos(armL)*15, -28 + Math.sin(armL)*20, -48 + Math.cos(armL)*30, -2 + Math.sin(armL)*38);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(22, -50);
  ctx.quadraticCurveTo(38 + Math.cos(armR)*15, -28 + Math.sin(armR)*20, 48 + Math.cos(armR)*30, -2 + Math.sin(armR)*38);
  ctx.stroke();

  ctx.fillStyle = gloves;
  ctx.beginPath();
  ctx.arc(-48 + Math.cos(armL)*30, -2 + Math.sin(armL)*38, 13, 0, Math.PI*2);
  ctx.arc(48 + Math.cos(armR)*30, -2 + Math.sin(armR)*38, 13, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -80, 17, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#1f1208';
  ctx.beginPath(); ctx.arc(0, -86, 16, Math.PI*1.1, Math.PI*1.9); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -94, 13, 8, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-6, -80, 2.5, 0, Math.PI*2);
  ctx.arc(6, -80, 2.5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ===================== BOLA COM ROTAÇÃO =====================
function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rotation);

  // Sombra
  ctx.beginPath();
  ctx.ellipse(0, 10, ball.radius*1.05, 5.5, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  // Bola
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // Painéis (giram junto)
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius*0.5, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-ball.radius*0.75, 0);
  ctx.lineTo(ball.radius*0.75, 0);
  ctx.moveTo(0, -ball.radius*0.75);
  ctx.lineTo(0, ball.radius*0.75);
  ctx.stroke();

  ctx.restore();
}

function getAimPower() {
  const dx = aimStart.x - aimCurrent.x;
  const dy = aimStart.y - aimCurrent.y;
  return Math.min(Math.sqrt(dx*dx + dy*dy)/5.0, 26);
}

function shoot() {
  if (!canShoot) return;
  const power = getAimPower();
  if (power < 3.5) return;

  const angle = Math.atan2(aimStart.y - aimCurrent.y, aimCurrent.x - aimStart.x);

  // Física mais realista
  ball.vx = Math.cos(angle) * power * 1.22;
  ball.vy = Math.sin(angle) * power * 1.22;
  ball.spin = (aimCurrent.x - aimStart.x) * 0.015; // efeito
  ball.moving = true;
  canShoot = false;
  isAiming = false;

  // Animação de chute
  player.legKick = 1.15;
  player.lean = 1.25;
  player.armSwing = 1;
  setTimeout(() => {
    player.legKick = 0;
    player.lean = 0;
    player.armSwing = 0;
  }, 480);

  // Goleiro demora um pouco para reagir (mais realista)
  keeper.reactionTimer = 8 + Math.random() * 10;
  decideKeeperDive();
}

function decideKeeperDive() {
  const futureX = ball.x + ball.vx * 32;
  let dir = 0;
  if (futureX < 315) dir = -1;
  else if (futureX > 485) dir = 1;

  // Chance de errar o lado
  if (Math.random() < 0.30) {
    const opts = [-1, 0, 1].filter(d => d !== dir);
    dir = opts[Math.floor(Math.random() * opts.length)];
  }

  keeper.diveDir = dir;
  keeper.targetX = 400 + dir * 135;
}

function resetBall() {
  ball.x = ballStart.x;
  ball.y = ballStart.y;
  ball.vx = 0; ball.vy = 0;
  ball.moving = false;
  ball.rotation = 0;
  ball.spin = 0;
  canShoot = true;
  keeper.x = 400;
  keeper.diving = false;
  keeper.diveProgress = 0;
  keeper.targetX = 400;
  keeper.reactionTimer = 0;
  player.legKick = 0;
  player.lean = 0;
  player.armSwing = 0;
}

function update() {
  // Tremor de tela
  if (shake > 0) shake *= 0.88;

  if (ball.moving) {
    // Física melhorada
    ball.vx *= 0.991;          // resistência do ar
    ball.vy += 0.21;           // gravidade
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Rotação da bola
    ball.rotation += ball.spin + ball.vx * 0.04;
    ball.spin *= 0.98;

    // Reação atrasada do goleiro
    if (keeper.reactionTimer > 0) {
      keeper.reactionTimer--;
      if (keeper.reactionTimer <= 0) {
        keeper.diving = true;
        keeper.diveProgress = 0;
      }
    }

    // Colisão com goleiro
    const hitW = (keeper.diving ? 44 : 32) * keeper.scale;
    const hitH = (keeper.diving ? 40 : 50) * keeper.scale;

    if (Math.abs(ball.x - keeper.x) < hitW && Math.abs(ball.y - keeper.y) < hitH) {
      ball.moving = false;
      saves++;
      savesEl.textContent = saves;
      createParticles(ball.x, ball.y, '#f5c518', 22);
      addShake(11);
      showMessage('DEFENDEU! 🧤');
      setTimeout(resetBall, 1700);
      return;
    }

    // Gol
    if (ball.y < goalY + 24 && ball.x > goalLeft + 15 && ball.x < goalRight - 15) {
      ball.moving = false;
      goals++;
      goalsEl.textContent = goals;
      createParticles(ball.x, ball.y, '#00ff88', 28);
      addShake(16);
      showMessage('GOOOL! ⚽🔥');
      setTimeout(resetBall, 1800);
      return;
    }

    // Fora
    if (ball.y < goalY - 35 || ball.x < 25 || ball.x > 775 || ball.y > 565) {
      ball.moving = false;
      showMessage(ball.y < goalY ? 'PRA FORA!' : 'ERROU!');
      setTimeout(resetBall, 1400);
      return;
    }

    // Trave
    if (ball.y < goalY + 30) {
      if ((ball.x > goalLeft - 18 && ball.x < goalLeft + 18) ||
          (ball.x > goalRight - 18 && ball.x < goalRight + 18)) {
        ball.moving = false;
        createParticles(ball.x, ball.y, '#fff', 14);
        addShake(8);
        showMessage('NA TRAVE!');
        setTimeout(resetBall, 1500);
        return;
      }
    }
  }

  // Animação do goleiro
  if (keeper.diving) {
    keeper.diveProgress += 0.052;
    keeper.x += (keeper.targetX - keeper.x) * 0.15;
    if (keeper.diveProgress > 1.2) keeper.diving = false;
  }

  // Partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.save();
  // Aplicar tremor
  if (shake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  drawField();
  drawGoal();
  drawKeeper();
  drawPlayer();
  drawBall();

  // Linha de mira
  if (isAiming && canShoot) {
    const power = getAimPower();
    const angle = Math.atan2(aimStart.y - aimCurrent.y, aimCurrent.x - aimStart.x);

    ctx.strokeStyle = 'rgba(255,255,0,0.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    let px = ball.x, py = ball.y;
    let pvx = Math.cos(angle) * power * 1.22;
    let pvy = Math.sin(angle) * power * 1.22;
    ctx.moveTo(px, py);
    for (let t = 0; t < 55; t++) {
      px += pvx; py += pvy;
      pvy += 0.21; pvx *= 0.991;
      ctx.lineTo(px, py);
      if (py < 25) break;
    }
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(255,200,0,0.55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(aimStart.x, aimStart.y);
    ctx.lineTo(aimCurrent.x, aimCurrent.y);
    ctx.stroke();

    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 15px Arial';
    ctx.fillText('Força: ' + Math.round(power), aimCurrent.x + 14, aimCurrent.y - 14);
  }

  // Partículas
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 50);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', e => {
  if (!canShoot) return;
  isAiming = true;
  aimStart = {x: ball.x, y: ball.y};
  aimCurrent = getPos(e);
});
canvas.addEventListener('mousemove', e => {
  if (!isAiming) return;
  aimCurrent = getPos(e);
});
canvas.addEventListener('mouseup', () => {
  if (!isAiming) return;
  shoot();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!canShoot) return;
  isAiming = true;
  aimStart = {x: ball.x, y: ball.y};
  aimCurrent = getPos(e);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isAiming) return;
  aimCurrent = getPos(e);
}, {passive: false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!isAiming) return;
  shoot();
}, {passive: false});

function resetGame() {
  goals = 0; saves = 0;
  goalsEl.textContent = '0';
  savesEl.textContent = '0';
  resetBall();
  showMessage('Novo jogo!');
}

loop();
</script>
</body>
</html>
