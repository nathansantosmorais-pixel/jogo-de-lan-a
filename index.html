<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Pênaltis</title>
  <style>
    body { background: green; margin: 0; overflow: hidden; }
    canvas { display: block; margin: auto; background: #0a0; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let ball = { x: 400, y: 500, radius: 15, dx: 0, dy: 0, shooting: false };
    let goalkeeper = { x: 400, y: 120, width: 80, height: 40 };
    let goal = null;

    function drawField() {
      ctx.fillStyle = "green";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gol
      ctx.strokeStyle = "white";
      ctx.lineWidth = 5;
      ctx.strokeRect(200, 100, 400, 50);

      // Bola
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Goleiro
      ctx.fillStyle = "black";
      ctx.fillRect(goalkeeper.x - goalkeeper.width/2, goalkeeper.y, goalkeeper.width, goalkeeper.height);

      // Mensagem
      if (goal !== null) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText(goal ? "GOOOOL!!!" : "Defendido!", 320, 300);
      }
    }

    function reset() {
      ball.x = 400;
      ball.y = 500;
      ball.dx = 0;
      ball.dy = 0;
      ball.shooting = false;
      goal = null;
    }

    function update() {
      if (ball.shooting) {
        ball.x += ball.dx;
        ball.y += ball.dy;
        ball.dy += 0.5; // gravidade

        if (ball.y < 150) {
          if (Math.abs(ball.x - goalkeeper.x) < 50) {
            goal = false; // defesa
          } else {
            goal = true; // gol
          }
          ball.shooting = false;
          setTimeout(reset, 2000);
        }
      }
    }

    function loop() {
      update();
      drawField();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !ball.shooting) {
        ball.shooting = true;
        ball.dx = Math.random() * 10 - 5;
        ball.dy = -15;
        goalkeeper.x = 250 + Math.random() * 300; // goleiro se move
      }
    });

    loop();
  </script>
</body>
</html>
