<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Rampas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    color: #38bdf8;
    text-shadow: 0 0 12px #38bdf888;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #38bdf8;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(56,189,248,0.3);
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 1px 3px #000;
  }
  #message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 0 20px #000;
  }
  #controls {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #94a3b8;
    max-width: 520px;
  }
  button {
    margin: 8px 6px;
    padding: 10px 22px;
    font-size: 15px;
    background: #0ea5e9;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #38bdf8; }
</style>
</head>
<body>
  <h1>🏍 Moto Rampas</h1>
  <div id="gameContainer">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="ui">
      <div>Distância: <span id="dist">0</span>m</div>
      <div>Velocidade: <span id="speed">0</span> km/h</div>
    </div>
    <div id="message"></div>
  </div>
  <div id="controls">
    <b>Controles:</b> ← → ou A D para inclinar | ↑ ou W para acelerar | ↓ ou S para frear<br>
    Passe nas rampas e faça manobras no ar!
    <br>
    <button onclick="restart()">Reiniciar</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const distEl = document.getElementById('dist');
const speedEl = document.getElementById('speed');
const messageEl = document.getElementById('message');

let keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let bike = {
  x: 150,
  y: 280,
  vx: 0,
  vy: 0,
  angle: 0,
  angularVel: 0,
  onGround: true,
  crashed: false
};

let cameraX = 0;
let ground = [];
let distance = 0;
let gameOver = false;

function generateTerrain() {
  ground = [];
  let x = 0;
  let y = 320;

  for (let i = 0; i < 20; i++) {
    ground.push({ x: x, y: y });
    x += 40;
  }

  for (let i = 0; i < 40; i++) {
    const type = Math.random();

    if (type < 0.35) {
      const height = 40 + Math.random() * 70;
      const length = 80 + Math.random() * 60;
      for (let j = 0; j < length / 20; j++) {
        y -= height / (length / 20);
        ground.push({ x: x, y: y });
        x += 20;
      }
      for (let j = 0; j < length / 20; j++) {
        y += height / (length / 20);
        ground.push({ x: x, y: y });
        x += 20;
      }
    } else if (type < 0.55) {
      const height = 80 + Math.random() * 60;
      for (let j = 0; j < 6; j++) {
        y -= height / 6;
        ground.push({ x: x, y: y });
        x += 25;
      }
      x += 120 + Math.random() * 80;
      y += height * 0.3;
      for (let j = 0; j < 8; j++) {
        ground.push({ x: x, y: y });
        x += 20;
        y += 4;
      }
    } else {
      for (let j = 0; j < 8; j++) {
        y += (Math.random() - 0.5) * 15;
        y = Math.max(260, Math.min(350, y));
        ground.push({ x: x, y: y });
        x += 30;
      }
    }
  }

  for (let i = 0; i < 15; i++) {
    ground.push({ x: x, y: 320 });
    x += 40;
  }
}

function getGroundY(atX) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (atX >= ground[i].x && atX <= ground[i + 1].x) {
      const t = (atX - ground[i].x) / (ground[i + 1].x - ground[i].x);
      return ground[i].y + t * (ground[i + 1].y - ground[i].y);
    }
  }
  return 400;
}

function getGroundAngle(atX) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (atX >= ground[i].x && atX <= ground[i + 1].x) {
      const dx = ground[i + 1].x - ground[i].x;
      const dy = ground[i + 1].y - ground[i].y;
      return Math.atan2(dy, dx);
    }
  }
  return 0;
}

function showMessage(text, duration = 2000) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
  setTimeout(() => { if (!gameOver) messageEl.style.opacity = 0; }, duration);
}

function restart() {
  bike.x = 150;
  bike.y = 280;
  bike.vx = 0;
  bike.vy = 0;
  bike.angle = 0;
  bike.angularVel = 0;
  bike.onGround = true;
  bike.crashed = false;
  cameraX = 0;
  distance = 0;
  gameOver = false;
  messageEl.style.opacity = 0;
  generateTerrain();
  showMessage('Acelere e pegue as rampas!', 2000);
}

function update() {
  if (gameOver) return;

  const accel = keys['arrowup'] || keys['w'];
  const brake = keys['arrowdown'] || keys['s'];
  const left  = keys['arrowleft'] || keys['a'];
  const right = keys['arrowright'] || keys['d'];

  if (bike.onGround) {
    if (accel) bike.vx += 0.35;
    if (brake) bike.vx *= 0.92;
    bike.vx *= 0.985;

    if (left)  bike.angularVel -= 0.004;
    if (right) bike.angularVel += 0.004;
  } else {
    if (left)  bike.angularVel -= 0.006;
    if (right) bike.angularVel += 0.006;
    bike.angularVel *= 0.98;
  }

  bike.vx = Math.max(-3, Math.min(14, bike.vx));

  bike.x += bike.vx;
  bike.y += bike.vy;
  bike.angle += bike.angularVel;

  if (!bike.onGround) {
    bike.vy += 0.45;
  }

  const groundY = getGroundY(bike.x);
  const groundAngle = getGroundAngle(bike.x);

  if (bike.y + 18 > groundY) {
    if (bike.vy > 8 || Math.abs(bike.angle - groundAngle) > 1.1) {
      bike.crashed = true;
      gameOver = true;
      showMessage('CAIU! 💥', 99999);
      return;
    }

    bike.y = groundY - 18;
    bike.vy = 0;
    bike.onGround = true;

    bike.angle += (groundAngle - bike.angle) * 0.25;
    bike.angularVel *= 0.7;

    if (groundAngle < -0.3 && bike.vx > 4) {
      bike.vy = groundAngle * bike.vx * 0.8;
      bike.onGround = false;
    }
  } else {
    bike.onGround = false;
  }

  cameraX = bike.x - 200;

  distance = Math.max(0, Math.floor((bike.x - 150) / 10));
  distEl.textContent = distance;
  speedEl.textContent = Math.floor(Math.abs(bike.vx) * 12);

  if (bike.y > 500) {
    gameOver = true;
    showMessage('CAIU NO ABISMO! 😱', 99999);
  }
}

function drawBike() {
  ctx.save();
  ctx.translate(bike.x - cameraX, bike.y);
  ctx.rotate(bike.angle);

  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 22, 30, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Corpo
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(-28, -8, 56, 14);

  // Banco
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-10, -14, 28, 8);

  // Guidão
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(18, -8);
  ctx.lineTo(26, -18);
  ctx.lineTo(32, -16);
  ctx.stroke();

  // Rodas
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-22, 12, 12, 0, Math.PI * 2);
  ctx.arc(22, 12, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-22, 2); ctx.lineTo(-22, 22);
  ctx.moveTo(-32, 12); ctx.lineTo(-12, 12);
  ctx.moveTo(22, 2); ctx.lineTo(22, 22);
  ctx.moveTo(12, 12); ctx.lineTo(32, 12);
  ctx.stroke();

  // Piloto
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(5, -22, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3b82f6';
  ctx.beginPath();
  ctx.arc(5, -24, 8, Math.PI, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#1e40af';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(5, -14);
  ctx.lineTo(0, 0);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  // Limpa tudo (remove as marcas)
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Céu
  const sky = ctx.createLinearGradient(0, 0, 0, 400);
  sky.addColorStop(0, '#0ea5e9');
  sky.addColorStop(0.45, '#38bdf8');
  sky.addColorStop(0.45, '#94a3b8');
  sky.addColorStop(1, '#64748b');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Montanhas de fundo
  ctx.fillStyle = '#64748b';
  for (let i = 0; i < 8; i++) {
    const mx = ((i * 200) - cameraX * 0.3) % 900 - 100;
    ctx.beginPath();
    ctx.moveTo(mx, 200);
    ctx.lineTo(mx + 100, 80 + (i % 3) * 30);
    ctx.lineTo(mx + 200, 200);
    ctx.fill();
  }

  // Terreno
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(0, 400);
  for (let i = 0; i < ground.length; i++) {
    const gx = ground[i].x - cameraX;
    if (gx > -50 && gx < 850) {
      ctx.lineTo(gx, ground[i].y);
    }
  }
  ctx.lineTo(800, 400);
  ctx.closePath();
  ctx.fill();

  // Linha do chão
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < ground.length; i++) {
    const gx = ground[i].x - cameraX;
    if (gx > -20 && gx < 820) {
      if (!started) {
        ctx.moveTo(gx, ground[i].y);
        started = true;
      } else {
        ctx.lineTo(gx, ground[i].y);
      }
    }
  }
  ctx.stroke();

  // Moto
  if (!bike.crashed) {
    drawBike();
  } else {
    ctx.save();
    ctx.translate(bike.x - cameraX, bike.y);
    ctx.rotate(bike.angle + 0.8);
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(-25, -6, 50, 12);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

generateTerrain();
showMessage('Acelere com ↑ e pegue as rampas!', 2500);
loop();
</script>
</body>
</html>
