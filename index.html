<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Corrida 2D</title>
<style>
  body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
  }
  canvas {
    background: #222;
    border: 4px solid #555;
    border-radius: 8px;
  }
  #ui {
    position: absolute;
    top: 20px;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }
  #score {
    font-size: 28px;
    font-weight: bold;
  }
  #speed {
    font-size: 18px;
    color: #aaa;
    margin-top: 5px;
  }
  #gameOver {
    display: none;
    font-size: 36px;
    color: #ff4444;
    margin-top: 20px;
  }
  #restart {
    display: none;
    margin-top: 15px;
    font-size: 18px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div id="ui">
    <div id="score">Pontos: 0</div>
    <div id="speed">Velocidade: 4.0</div>
    <div id="gameOver">GAME OVER</div>
    <div id="restart">Pressione ESPAÇO para reiniciar</div>
  </div>
  <canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// Carro do jogador
const player = {
  x: W / 2 - 20,
  y: H - 100,
  width: 40,
  height: 70,
  speed: 6,
  color: '#00ccff'
};

// Obstáculos
let obstacles = [];
let obstacleSpeed = 4;
let spawnTimer = 0;
let score = 0;
let gameOver = false;
let roadOffset = 0;

// Controle de tempo para aumentar velocidade a cada segundo
let lastSpeedIncrease = Date.now();

// Controles
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && gameOver) restart();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function spawnObstacle() {
  const laneWidth = W / 3;
  const lane = Math.floor(Math.random() * 3);
  obstacles.push({
    x: lane * laneWidth + laneWidth / 2 - 20,
    y: -80,
    width: 40,
    height: 70,
    color: `hsl(${Math.random() * 60}, 80%, 50%)`
  });
}

function update() {
  if (gameOver) return;

  // Movimento do jogador
  if (keys['ArrowLeft'] && player.x > 10) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < W - player.width - 10) player.x += player.speed;

  // Aumenta a velocidade a cada 1 segundo
  const now = Date.now();
  if (now - lastSpeedIncrease >= 1000) {
    obstacleSpeed += 0.3; // aumenta 0.3 por segundo
    lastSpeedIncrease = now;
    document.getElementById('speed').textContent = 'Velocidade: ' + obstacleSpeed.toFixed(1);
  }

  // Spawn de obstáculos
  spawnTimer++;
  if (spawnTimer > Math.max(20, 60 - obstacleSpeed * 3)) { // spawna mais rápido conforme a velocidade sobe
    spawnObstacle();
    spawnTimer = 0;
  }

  // Movimento dos obstáculos
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += obstacleSpeed;

    // Colisão
    if (
      player.x < obstacles[i].x + obstacles[i].width &&
      player.x + player.width > obstacles[i].x &&
      player.y < obstacles[i].y + obstacles[i].height &&
      player.y + player.height > obstacles[i].y
    ) {
      gameOver = true;
      document.getElementById('gameOver').style.display = 'block';
      document.getElementById('restart').style.display = 'block';
    }

    // Remove se saiu da tela
    if (obstacles[i].y > H) {
      obstacles.splice(i, 1);
      score += 10;
      document.getElementById('score').textContent = 'Pontos: ' + score;
    }
  }

  // Animação da estrada
  roadOffset += obstacleSpeed;
  if (roadOffset > 40) roadOffset = 0;
}

function drawRoad() {
  // Fundo da pista
  ctx.fillStyle = '#333';
  ctx.fillRect(0, 0, W, H);

  // Linhas laterais
  ctx.fillStyle = '#fff';
  ctx.fillRect(5, 0, 8, H);
  ctx.fillRect(W - 13, 0, 8, H);

  // Linhas do meio (tracejadas)
  ctx.fillStyle = '#ffff00';
  for (let y = -40 + roadOffset; y < H; y += 40) {
    ctx.fillRect(W / 3 - 4, y, 8, 25);
    ctx.fillRect(W * 2 / 3 - 4, y, 8, 25);
  }
}

function drawCar(x, y, color) {
  // Corpo
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 40, 70);

  // Janela
  ctx.fillStyle = '#111';
  ctx.fillRect(x + 5, y + 10, 30, 20);

  // Faróis
  ctx.fillStyle = '#ffffaa';
  ctx.fillRect(x + 5, y + 60, 10, 8);
  ctx.fillRect(x + 25, y + 60, 10, 8);

  // Rodas
  ctx.fillStyle = '#222';
  ctx.fillRect(x - 5, y + 10, 8, 20);
  ctx.fillRect(x + 37, y + 10, 8, 20);
  ctx.fillRect(x - 5, y + 45, 8, 20);
  ctx.fillRect(x + 37, y + 45, 8, 20);
}

function draw() {
  drawRoad();
  drawCar(player.x, player.y, player.color);

  obstacles.forEach(obs => {
    drawCar(obs.x, obs.y, obs.color);
  });
}

function restart() {
  obstacles = [];
  score = 0;
  obstacleSpeed = 4;
  spawnTimer = 0;
  gameOver = false;
  lastSpeedIncrease = Date.now();
  player.x = W / 2 - 20;
  document.getElementById('score').textContent = 'Pontos: 0';
  document.getElementById('speed').textContent = 'Velocidade: 4.0';
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('restart').style.display = 'none';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
