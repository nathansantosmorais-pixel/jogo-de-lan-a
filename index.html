<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Rampas Realistas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    color: #38bdf8;
    text-shadow: 0 0 12px #38bdf888;
  }
  #gameContainer {
    position: relative;
    border: 3px solid #38bdf8;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(56,189,248,0.3);
    overflow: hidden;
  }
  canvas { display: block; }
  #ui {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 1px 3px #000;
  }
  #message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 0 20px #000;
  }
  #controls {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #94a3b8;
    max-width: 520px;
  }
  button {
    margin: 8px 6px;
    padding: 10px 22px;
    font-size: 15px;
    background: #0ea5e9;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #38bdf8; }
</style>
</head>
<body>
  <h1>🏍 Moto Rampas</h1>
  <div id="gameContainer">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="ui">
      <div>Distância: <span id="dist">0</span>m</div>
      <div>Velocidade: <span id="speed">0</span> km/h</div>
    </div>
    <div id="message"></div>
  </div>
  <div id="controls">
    <b>Controles:</b> ← → ou A D para inclinar | ↑ ou W para acelerar | ↓ ou S para frear<br>
    Rampas mais realistas agora!
    <br>
    <button onclick="restart()">Reiniciar</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const distEl = document.getElementById('dist');
const speedEl = document.getElementById('speed');
const messageEl = document.getElementById('message');

let keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let bike = {
  x: 150,
  y: 280,
  vx: 0,
  vy: 0,
  angle: 0,
  angularVel: 0,
  onGround: true,
  crashed: false
};

let cameraX = 0;
let ground = [];
let distance = 0;
let gameOver = false;

// ===================== GERAÇÃO DE RAMPAS REALISTAS =====================
function generateTerrain() {
  ground = [];
  let x = 0;
  let y = 310;

  // Chão inicial plano
  for (let i = 0; i < 25; i++) {
    ground.push({ x, y });
    x += 30;
  }

  for (let i = 0; i < 35; i++) {
    const type = Math.random();

    if (type < 0.40) {
      // ===== RAMPA SUAVE (subida + descida) =====
      const height = 50 + Math.random() * 55;
      const upLen = 90 + Math.random() * 50;
      const downLen = 100 + Math.random() * 60;

      // Subida curva (ease-in / ease-out)
      for (let t = 0; t <= 1; t += 0.04) {
        const ease = t * t * (3 - 2 * t); // smoothstep
        ground.push({ x, y: y - height * ease });
        x += upLen * 0.04;
      }
      y -= height;

      // Topo pequeno plano
      for (let j = 0; j < 3; j++) {
        ground.push({ x, y });
        x += 18;
      }

      // Descida curva
      for (let t = 0; t <= 1; t += 0.04) {
        const ease = t * t * (3 - 2 * t);
        ground.push({ x, y: y + height * ease });
        x += downLen * 0.04;
      }
      y += height;

    } else if (type < 0.65) {
      // ===== RAMPA DE SALTO (kicker) =====
      const height = 70 + Math.random() * 50;
      const rampLen = 110 + Math.random() * 40;

      // Subida acelerada (mais íngreme no final)
      for (let t = 0; t <= 1; t += 0.035) {
        const ease = Math.pow(t, 1.6); // mais agressiva
        ground.push({ x, y: y - height * ease });
        x += rampLen * 0.035;
      }
      y -= height;

      // Lip (beirada do salto)
      for (let j = 0; j < 2; j++) {
        ground.push({ x, y });
        x += 12;
      }

      // Vão (ar)
      const gap = 100 + Math.random() * 90;
      x += gap;

      // Aterrissagem inclinada
      const landHeight = height * 0.55;
      for (let t = 0; t <= 1; t += 0.05) {
        const ease = t * t;
        ground.push({ x, y: y + landHeight * ease });
        x += 25;
      }
      y += landHeight;

    } else if (type < 0.80) {
      // ===== ONDULAÇÃO / WHOOPS =====
      for (let j = 0; j < 6; j++) {
        const h = 18 + Math.random() * 22;
        // sobe
        for (let t = 0; t <= 1; t += 0.1) {
          ground.push({ x, y: y - h * Math.sin(t * Math.PI) });
          x += 14;
        }
      }

    } else {
      // ===== TRECHO PLANO / LEVE ONDULAÇÃO =====
      for (let j = 0; j < 10; j++) {
        y += (Math.random() - 0.5) * 12;
        y = Math.max(250, Math.min(340, y));
        ground.push({ x, y });
        x += 28;
      }
    }
  }

  // Final plano
  for (let i = 0; i < 20; i++) {
    ground.push({ x, y: 310 });
    x += 35;
  }
}

function getGroundY(atX) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (atX >= ground[i].x && atX <= ground[i + 1].x) {
      const t = (atX - ground[i].x) / (ground[i + 1].x - ground[i].x || 1);
      // interpolação suave
      const smoothT = t * t * (3 - 2 * t);
      return ground[i].y + smoothT * (ground[i + 1].y - ground[i].y);
    }
  }
  return 400;
}

function getGroundAngle(atX) {
  for (let i = 0; i < ground.length - 1; i++) {
    if (atX >= ground[i].x && atX <= ground[i + 1].x) {
      const dx = ground[i + 1].x - ground[i].x;
      const dy = ground[i + 1].y - ground[i].y;
      return Math.atan2(dy, dx);
    }
  }
  return 0;
}

function showMessage(text, duration = 2000) {
  messageEl.textContent = text;
  messageEl.style.opacity = 1;
  setTimeout(() => { if (!gameOver) messageEl.style.opacity = 0; }, duration);
}

function restart() {
  bike.x = 150;
  bike.y = 280;
  bike.vx = 0;
  bike.vy = 0;
  bike.angle = 0;
  bike.angularVel = 0;
  bike.onGround = true;
  bike.crashed = false;
  cameraX = 0;
  distance = 0;
  gameOver = false;
  messageEl.style.opacity = 0;
  generateTerrain();
  showMessage('Rampas realistas ativadas!', 2000);
}

function update() {
  if (gameOver) return;

  const accel = keys['arrowup'] || keys['w'];
  const brake = keys['arrowdown'] || keys['s'];
  const left  = keys['arrowleft'] || keys['a'];
  const right = keys['arrowright'] || keys['d'];

  if (bike.onGround) {
    if (accel) bike.vx += 0.32;
    if (brake) bike.vx *= 0.91;
    bike.vx *= 0.987;

    if (left)  bike.angularVel -= 0.0035;
    if (right) bike.angularVel += 0.0035;
  } else {
    if (left)  bike.angularVel -= 0.0055;
    if (right) bike.angularVel += 0.0055;
    bike.angularVel *= 0.975;
  }

  bike.vx = Math.max(-2.5, Math.min(13.5, bike.vx));

  bike.x += bike.vx;
  bike.y += bike.vy;
  bike.angle += bike.angularVel;

  if (!bike.onGround) {
    bike.vy += 0.42;
  }

  const groundY = getGroundY(bike.x);
  const groundAngle = getGroundAngle(bike.x);

  if (bike.y + 17 > groundY) {
    // Queda forte ou ângulo ruim = crash
    if (bike.vy > 9.5 || Math.abs(bike.angle - groundAngle) > 1.15) {
      bike.crashed = true;
      gameOver = true;
      showMessage('CAIU! 💥', 99999);
      return;
    }

    bike.y = groundY - 17;
    bike.vy *= 0.15; // pequeno bounce
    bike.onGround = true;

    // Alinha suavemente com o terreno
    bike.angle += (groundAngle - bike.angle) * 0.28;
    bike.angularVel *= 0.65;

    // Saída natural de rampa
    if (groundAngle < -0.25 && bike.vx > 5) {
      bike.vy = groundAngle * bike.vx * 0.95;
      bike.onGround = false;
    }
  } else {
    bike.onGround = false;
  }

  cameraX = bike.x - 220;

  distance = Math.max(0, Math.floor((bike.x - 150) / 10));
  distEl.textContent = distance;
  speedEl.textContent = Math.floor(Math.abs(bike.vx) * 11.5);

  if (bike.y > 520) {
    gameOver = true;
    showMessage('CAIU NO ABISMO! 😱', 99999);
  }
}

function drawBike() {
  ctx.save();
  ctx.translate(bike.x - cameraX, bike.y);
  ctx.rotate(bike.angle);

  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 28, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Corpo
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(-26, -7, 52, 13);

  // Banco
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(-8, -13, 26, 7);

  // Guidão
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(16, -7);
  ctx.lineTo(24, -17);
  ctx.lineTo(30, -15);
  ctx.stroke();

  // Rodas
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-20, 11, 11, 0, Math.PI * 2);
  ctx.arc(20, 11, 11, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-20, 2); ctx.lineTo(-20, 20);
  ctx.moveTo(-29, 11); ctx.lineTo(-11, 11);
  ctx.moveTo(20, 2); ctx.lineTo(20, 20);
  ctx.moveTo(11, 11); ctx.lineTo(29, 11);
  ctx.stroke();

  // Piloto
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(4, -20, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3b82f6';
  ctx.beginPath();
  ctx.arc(4, -22, 7, Math.PI, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#1e40af';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(4, -13);
  ctx.lineTo(0, 0);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  // Limpa
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Céu
  const sky = ctx.createLinearGradient(0, 0, 0, 400);
  sky.addColorStop(0, '#0ea5e9');
  sky.addColorStop(0.42, '#38bdf8');
  sky.addColorStop(0.42, '#94a3b8');
  sky.addColorStop(1, '#64748b');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Montanhas
  ctx.fillStyle = '#64748b';
  for (let i = 0; i < 8; i++) {
    const mx = ((i * 200) - cameraX * 0.25) % 900 - 100;
    ctx.beginPath();
    ctx.moveTo(mx, 200);
    ctx.lineTo(mx + 100, 75 + (i % 3) * 28);
    ctx.lineTo(mx + 200, 200);
    ctx.fill();
  }

  // Terreno com preenchimento
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(-20, 400);

  for (let i = 0; i < ground.length; i++) {
    const gx = ground[i].x - cameraX;
    if (gx > -60 && gx < 860) {
      ctx.lineTo(gx, ground[i].y);
    }
  }
  ctx.lineTo(820, 400);
  ctx.closePath();
  ctx.fill();

  // Linha superior do terreno (mais definida)
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 4;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < ground.length; i++) {
    const gx = ground[i].x - cameraX;
    if (gx > -30 && gx < 830) {
      if (!started) {
        ctx.moveTo(gx, ground[i].y);
        started = true;
      } else {
        ctx.lineTo(gx, ground[i].y);
      }
    }
  }
  ctx.stroke();

  // Moto
  if (!bike.crashed) {
    drawBike();
  } else {
    ctx.save();
    ctx.translate(bike.x - cameraX, bike.y);
    ctx.rotate(bike.angle + 0.9);
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(-24, -5, 48, 11);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

generateTerrain();
showMessage('Rampas realistas! Acelere e voe!', 2500);
loop();
</script>
</body>
</html>
